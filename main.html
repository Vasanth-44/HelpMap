<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthSafe — Redirecting</title>
    <script>
        // Automatic router based on active role
        const role = localStorage.getItem("userRole") || "patient";
        if (role === "helper") {
            window.location.replace("helper.html");
        } else {
            window.location.replace("patient.html");
        }
    </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f8fafc; color: #64748b;">
    <p>Loading your dashboard...</p>
</body>
</html>
