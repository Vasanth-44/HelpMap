<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthSafe — Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-container">
        <header class="login-header">
            <div class="logo-symbol">✚</div>
            <h1>HealthSafe</h1>
            <p>Community Emergency & Healthcare Assistance</p>
        </header>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input 
                    type="tel" 
                    id="phone" 
                    class="input-field" 
                    placeholder="Enter 10-digit mobile number" 
                    maxlength="10" 
                    required 
                    autocomplete="tel"
                />
            </div>

            <div class="form-group">
                <label>I am logging in as</label>
                <div class="role-options">
                    <div class="role-card active" id="rolePatient" onclick="selectRole('patient')">
                        <div class="role-icon">🧑‍⚕️</div>
                        <div class="role-title">Patient</div>
                        <div class="role-desc">Need assistance</div>
                    </div>
                    <div class="role-card" id="roleHelper" onclick="selectRole('helper')">
                        <div class="role-icon">🤝</div>
                        <div class="role-title">Helper / Responder</div>
                        <div class="role-desc">Provide assistance</div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="loginBtn">Continue to Dashboard</button>
        </form>

        <div class="demo-buttons">
            <div class="demo-label">Quick test login</div>
            <div class="demo-btn-group">
                <button type="button" class="btn-secondary" onclick="quickLogin('patient')">Login as Patient</button>
                <button type="button" class="btn-secondary" onclick="quickLogin('helper')">Login as Helper</button>
            </div>
        </div>
    </main>

    <script>
        let selectedRole = 'patient';

        function selectRole(role) {
            selectedRole = role;
            document.getElementById('rolePatient').classList.toggle('active', role === 'patient');
            document.getElementById('roleHelper').classList.toggle('active', role === 'helper');
        }

        function handleLogin(event) {
            event.preventDefault();
            const phone = document.getElementById("phone").value.trim().replace(/\D/g, "");

            if (phone.length !== 10) {
                alert("Please enter a valid 10-digit phone number");
                return;
            }

            localStorage.setItem("phone", phone);
            localStorage.setItem("userRole", selectedRole);
            localStorage.setItem("userName", selectedRole === 'patient' ? "Ramesh Kumar" : "Dr. Arvind");

            // Redirect to the distinct separate dashboard
            if (selectedRole === 'patient') {
                window.location.href = "patient.html";
            } else {
                window.location.href = "helper.html";
            }
        }

        function quickLogin(role) {
            selectRole(role);
            const samplePhone = role === 'patient' ? "9876543210" : "9812345678";
            document.getElementById("phone").value = samplePhone;
            localStorage.setItem("phone", samplePhone);
            localStorage.setItem("userRole", role);
            localStorage.setItem("userName", role === 'patient' ? "Ramesh Kumar" : "Dr. Arvind");

            if (role === 'patient') {
                window.location.href = "patient.html";
            } else {
                window.location.href = "helper.html";
            }
        }

        // Silent GPS detection with clean fallback coordinates (no nagging alerts)
        document.addEventListener("DOMContentLoaded", () => {
            const phoneInput = document.getElementById("phone");
            phoneInput.addEventListener("input", function() {
                this.value = this.value.replace(/[^0-9]/g, "");
            });

            const savedPhone = localStorage.getItem("phone");
            if (savedPhone) phoneInput.value = savedPhone;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        localStorage.setItem("userCoords", JSON.stringify({
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude
                        }));
                    },
                    () => {
                        localStorage.setItem("userCoords", JSON.stringify({
                            lat: 13.0827,
                            lng: 80.2707
                        }));
                    },
                    { timeout: 3000, enableHighAccuracy: true }
                );
            }
        });
    </script>
</body>
</html>
